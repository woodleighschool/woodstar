---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Container

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/release.yaml"
      - "Dockerfile"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "schema/**"
      - "tools/geoipdb/**"
      - "web/**"
  pull_request:
    branches:
      - main
    types:
      - labeled
      - reopened
      - synchronize
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  container:
    name: Container
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'container') ||
          (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'container'))
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,enable=${{ github.event_name == 'pull_request' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            VERSION=${{ github.event.release.tag_name || github.sha }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: ${{ github.event_name == 'release' && 'mode=max' || 'false' }}
          push: true
          sbom: ${{ github.event_name == 'release' }}
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Install Cosign
        if: ${{ github.event_name == 'release' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release image
        if: ${{ github.event_name == 'release' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  goreleaser:
    name: GoReleaser
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          experimental: true
          install_args: --locked go node pnpm

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
