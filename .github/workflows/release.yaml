---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  release:
    name: Release
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
      cache: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    name: GoReleaser (${{ matrix.workdir }})
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        workdir: [".", "stemma"]
    permissions:
      contents: write
      packages: write
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          experimental: true
          install_args: --locked go node pnpm

      - name: Setup plugin publisher
        if: ${{ matrix.workdir == 'stemma' }}
        working-directory: stemma
        run: |
          mise install --locked oras
          printf '%s' "$REGISTRY_TOKEN" | mise exec -- oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GoReleaser version
        id: goreleaser-version
        working-directory: ${{ matrix.workdir }}
        run: echo "version=$(mise tool goreleaser --requested)" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: release --clean --parallelism=2
          workdir: ${{ matrix.workdir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish plugin index
        if: ${{ matrix.workdir == 'stemma' }}
        run: mise run //stemma:publish-index "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
