---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Stemma Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"

jobs:
  release:
    name: Stemma
    if: startsWith(github.event.release.tag_name, 'stemma-')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      # Release Please publishes every release as latest and has no per-package
      # opt-out (googleapis/release-please#2317).
      - name: Mark the server release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          server_tag="$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
            --jq 'first(.[].tagName | select(startswith("stemma-") | not))')"
          gh release edit "$server_tag" --latest

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
          experimental: true
          install_args: --locked go go:github.com/google/go-licenses/v2

      - name: Resolve release version
        id: release-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${RELEASE_TAG#stemma-v}" >> "$GITHUB_OUTPUT"

      - name: Resolve GoReleaser version
        id: goreleaser-version
        working-directory: stemma
        run: echo "version=$(mise tool goreleaser --requested)" >> "$GITHUB_OUTPUT"

      - name: Build plugin bundles
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: release --snapshot --clean --skip=publish --parallelism=2
          workdir: stemma
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.release-version.outputs.version }}

      - name: Upload release bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" stemma/dist/*.tar.zst stemma/dist/*_checksums.txt --clobber

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish plugin
        uses: woodleighschool/stemma/actions/publish-plugin@d5ea239588df8281a52166efdcc267a21400be9f # v0.11.1
        with:
          workdir: stemma
          image: ghcr.io/woodleighschool/woodstar/stemma:${{ steps.release-version.outputs.version }}
