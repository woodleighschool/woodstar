[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.gen-api-docs]
description = "Generate docs API reference"
depends = [":deps"]
run = "pnpm run gen-api-docs"

[tasks.clean-api-docs]
description = "Clean generated docs API reference"
run = "pnpm run clean-api-docs"

[tasks.dev]
description = "Generate API docs and start the development server"
depends = [":deps"]
run = "pnpm run dev"

[tasks.build]
description = "Generate API docs and build the site"
depends = [":deps"]
run = "pnpm run build"

[tasks.serve]
description = "Serve the production build"
depends = [":build"]
run = "pnpm run serve"

[tasks.typecheck]
description = "Generate API docs and type-check"
depends = [":deps"]
run = "pnpm run typecheck"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "oxfmt --check"

[tasks.lint]
description = "Lint and type-check"
depends = [":deps"]
run = "pnpm run lint"

[tasks.lint-fix]
description = "Fix lint issues and type-check"
depends = [":deps"]
run = "pnpm run lint:fix"

[tasks.clean]
description = "Remove build output and Docusaurus caches"
run = "rm -rf build .docusaurus .cache-loader"
