[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
depends = [":deps"]
run = """
NODE_EXTRA_CA_CERTS="../.local/tls/ca/rootCA.pem" pnpm run dev
"""

[tasks.build]
depends = [":deps"]
run = "pnpm run build"

[tasks.serve]
run = "pnpm run preview"

[tasks.lint]
depends = [":deps"]
run = "pnpm run lint"

[tasks.lint-fix]
depends = [":deps"]
run = "pnpm run lint:fix"

[tasks.typecheck]
depends = [":deps"]
run = "pnpm run typecheck"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "oxfmt --check"

[tasks.openapi-types]
depends = [":deps"]
run = "pnpm run openapi:types"

[tasks.clean]
run = "rm -rf dist"
