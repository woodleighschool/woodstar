[tools]
oras = "1.3.4"
goreleaser = "2.18.0"

[tasks.release-check]
description = "Validate the plugin release configuration"
run = "goreleaser check"

[tasks.snapshot]
description = "Build all plugin platform bundles without publishing"
run = "goreleaser release --snapshot --clean --skip=publish"

[tasks.publish-index]
description = "Publish the plugin release index after its platform bundles"
usage = 'arg "<tag>" help="Release tag already published by GoReleaser"'
run = '''
set -eu
tag="${usage_tag:?}"
set --
for os in darwin linux windows; do
  for arch in amd64 arm64; do
    set -- "$@" "${tag}-${os}-${arch}"
  done
done
oras manifest index create "ghcr.io/woodleighschool/woodstar/stemma:${tag}" "$@"
'''

[tasks.deps]
description = "Download Stemma destination dependencies"
run = "go mod download"

[tasks.build]
description = "Build the Stemma destination"
run = "go build -trimpath -o build/stemma-woodstar ./cmd/stemma-woodstar"

[tasks.test]
description = "Run Stemma destination checks"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.test-postgres]
description = "Test the Stemma destination against PostgreSQL"
run = '''
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=postgres ./...
'''

[tasks.tidy]
description = "Tidy the Stemma destination module"
run = "go mod tidy"

[tasks.tidy-check]
description = "Check the Stemma destination module is tidy"
run = "go mod tidy -diff"

[tasks.vulncheck]
description = "Scan the Stemma destination for known vulnerabilities"
run = "govulncheck ./..."

[tasks.lint]
description = "Run Stemma destination linters"
run = "golangci-lint run --allow-serial-runners"

[tasks.lint-fix]
description = "Run Stemma destination linters and apply fixes"
run = "golangci-lint run --allow-serial-runners --fix"

[tasks.format]
description = "Format the Stemma destination"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Check Stemma destination formatting"
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"
