[tools]
"github:woodleighschool/stemma" = "v0.12.4"

[tasks.deps]
run = "go mod download"

[tasks.build]
run = "go build -trimpath -o build/plugin ./cmd/plugin"

[tasks.test]
description = "Vet Go code and run race-enabled tests"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.bench]
description = "Measure destination reconciliation"
env = { GOMAXPROCS = "4", GOFLAGS = "-p=1" }
run = "go test -run='^$' -bench=BenchmarkReconcile -benchtime=1s ./internal/destination"

[tasks.test-postgres]
description = "Test the Stemma destination against PostgreSQL"
run = '''
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=postgres ./...
'''

[tasks.tidy]
run = "go mod tidy"

[tasks.tidy-check]
run = "go mod tidy -diff"

[tasks.vulncheck]
run = "govulncheck ./..."

[tasks.lint]
run = "golangci-lint run --allow-serial-runners"

[tasks.lint-fix]
run = "golangci-lint run --allow-serial-runners --fix"

[tasks.format]
run = "go fmt ./..."

[tasks.fmt-check]
run = '''
unformatted=$(gofmt -l .) || exit 1
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''
