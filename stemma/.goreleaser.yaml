---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: stemma

before:
  hooks:
    - mise run //stemma:tidy-check
    - mkdir -p build
    - cp ../LICENSE build/LICENSE

builds:
  - id: plugin
    main: ./cmd/plugin
    binary: plugin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: plugin
    ids:
      - plugin
    formats:
      - tar.zst
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mtime: "1970-01-01T00:00:00Z"
    files:
      - src: build/LICENSE
        strip_parent: true
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"

publishers:
  - name: oci
    ids:
      - plugin
    dir: "{{ dir .ArtifactPath }}"
    cmd: >-
      oras push ghcr.io/woodleighschool/woodstar/stemma:{{ .Tag }}-{{ .Os }}-{{ .Arch }}
      --artifact-type application/vnd.stemma.plugin.v1
      --artifact-platform {{ .Os }}/{{ .Arch }}
      --annotation org.opencontainers.image.created={{ .CommitDate }}
      --annotation org.opencontainers.image.source=https://github.com/woodleighschool/woodstar
      {{ .ArtifactName }}:application/vnd.stemma.plugin.bundle.v1.tar+zstd

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  mode: keep-existing

changelog:
  disable: true
