monorepo_root = true

[tools]
go = "1.27.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
node = "26.8.1"
pnpm = "11.24.0"
golangci-lint = "2.13.2"
air = "1.67.4"
lefthook = "2.1.12"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.65.0"
oxlint = "1.78.0"
"npm:@commitlint/cli" = "21.2.2"
mkcert = "1.4.4"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.27.3"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["web", "docs"]

[tasks.go-deps]
description = "Download Go dependencies"
run = "go mod download"

[tasks.deps]
description = "Install backend and web dependencies"
depends = ["go-deps", "//web:deps"]

[tasks.dev]
description = "Run backend and web development servers"
depends = ["//web:build"]
run = { tasks = ["dev-backend", "//web:dev"] }

[tasks.dev-tls]
description = "Generate repo-local development TLS files"
run = """
mkdir -p .local/tls/ca
CAROOT="$PWD/.local/tls/ca" mkcert \
  -cert-file .local/tls/woodstar.pem \
  -key-file .local/tls/woodstar-key.pem \
  woodstar
"""

[tasks.dev-tls-trust]
description = "Trust the repo-local development CA on this machine"
depends = ["dev-tls"]
run = 'CAROOT="$PWD/.local/tls/ca" mkcert -install'

[tasks.dev-backend]
description = "Run backend development server"
depends = ["geoip"]
run = "air"

[tasks.build]
description = "Build web bundle and backend binary"
depends = ["//web:build"]
run = { task = "backend" }

[tasks.docs]
description = "Validate and build the docs site"
run = [
  { task = "//docs:fmt-check" },
  { task = "//docs:lint" },
  { task = "//docs:build" },
]

[tasks.backend]
description = "Build backend binary"
run = "go build -o woodstar ./cmd/woodstar"

[tasks.geoip]
description = "Download the current DB-IP Lite databases"
run = "go run ./tools/geoipdb --output .local/geoip"

[tasks.tidy]
description = "Tidy the Go module"
run = "go mod tidy"

[tasks.tidy-check]
description = "Check the Go module is tidy"
run = "go mod tidy -diff"

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.migration]
description = "Create a timestamped PostgreSQL migration"
usage = '''
arg "<name>" help="Migration name"
'''
run = '''
goose -dir internal/postgres/migrations create "${usage_name?}" sql
'''

[tasks."migration:validate"]
description = "Validate PostgreSQL migration files"
run = "goose -dir internal/postgres/migrations validate"

[tasks.test]
description = "Run Go checks"
depends = ["geoip"]
run = [
  "WOODSTAR_GEOIP_CITY_FILE=$PWD/.local/geoip/dbip-city-lite.mmdb WOODSTAR_GEOIP_ASN_FILE=$PWD/.local/geoip/dbip-asn-lite.mmdb go vet ./...",
  "WOODSTAR_GEOIP_CITY_FILE=$PWD/.local/geoip/dbip-city-lite.mmdb WOODSTAR_GEOIP_ASN_FILE=$PWD/.local/geoip/dbip-asn-lite.mmdb go test -race -count=1 ./...",
]

[tasks.test-postgres]
description = "Run PostgreSQL component tests"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=postgres ./internal/...
"""

[tasks.test-e2e-munki]
description = "Run the Munki end-to-end lifecycle"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestMunki$' ./test/e2e
"""

[tasks.test-e2e-osquery]
description = "Run the osquery end-to-end lifecycles"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestOsquery(d)?$' ./test/e2e
"""

[tasks.test-e2e-santa]
description = "Run the Santa end-to-end protobuf lifecycle"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestSanta$' ./test/e2e
"""

[tasks.test-integration-storage]
description = "Run Garage-backed S3 backend conformance"
run = "go test -race -count=1 -tags=integration -v -run '^TestS3StorageBackend$' ./test/integration/storage"

[tasks.test-e2e-mdp]
description = "Run the MDP end-to-end mirroring lifecycle"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestMDP$' ./test/e2e
"""

[tasks.test-e2e-orbit]
description = "Run the Orbit protocol fixture lifecycle"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestOrbit$' ./test/e2e
"""

[tasks.test-e2e]
description = "Run all end-to-end lifecycles"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v ./test/e2e
"""

[tasks.test-integration]
description = "Run integration suites"
run = [{ task = "test-integration-storage" }]

[tasks.test-all]
description = "Run dependency-free, PostgreSQL, integration, and end-to-end tests"
run = [
  { task = "test" },
  { task = "test-postgres" },
  { task = "test-integration" },
  { task = "test-e2e" },
]

[tasks.openapi]
description = "Generate OpenAPI schema"
run = "go run ./cmd/woodstar openapi --output web/openapi.yaml"

[tasks.openapi-types]
description = "Generate OpenAPI schema and clients"
run = [
  { task = "openapi" },
  { task = "//web:openapi-types" },
  "go tool oapi-codegen -config test/e2e/adminapi/oapi-codegen.yaml -o test/e2e/adminapi/client.gen.go web/openapi.yaml",
]

[tasks.generate]
description = "Regenerate checked-in generated artifacts"
run = { task = "openapi-types" }

[tasks.go-lint]
description = "Run Go linters"
run = "golangci-lint run"

[tasks.go-lint-fix]
description = "Run Go linters and apply fixes"
run = "golangci-lint run --fix"

[tasks.lint-fix]
description = "Run backend, web, and docs linters and apply fixes"
depends = ["go-lint-fix", "//web:lint-fix", "//docs:lint-fix"]

[tasks.lint]
description = "Run backend, web, and docs linters"
depends = ["go-lint", "//web:lint", "//docs:lint"]

[tasks.go-format]
description = "Format Go code"
run = "go fmt ./..."

[tasks.go-fmt-check]
description = "Check Go formatting"
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"

[tasks.format]
description = "Format backend, web, and docs code"
depends = ["go-format", "//web:format", "//docs:format"]

[tasks.fmt-check]
description = "Check backend, web, and docs formatting"
depends = ["go-fmt-check", "//web:fmt-check", "//docs:fmt-check"]

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[tasks.clean]
description = "Remove local build outputs"
run = "rm -rf woodstar .air build web/dist"

[tasks.schema-sync]
description = "Refresh the osquery schema snapshot"
run = "./schema/sync.sh"

[hooks]
postinstall = "lefthook install"
