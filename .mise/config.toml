monorepo_root = true

[tools]
go = "1.27.3"
"go:github.com/google/go-licenses/v2" = "v2.0.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
node = "26.13.0"
pnpm = "12.18.0"
golangci-lint = "2.15.0"
air = "1.67.4"
lefthook = "2.2.2"
jactionlint = "v2.5.0"
oxfmt = "0.75.0"
mkcert = "1.4.4"
"go:github.com/pressly/goose/v3/cmd/goose" = "v3.29.0"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["web", "docs", "stemma"]

[tasks.go-deps]
run = "go mod download"

[tasks.deps]
depends = ["go-deps", "//web:deps"]

[tasks.dev]
description = "Run backend and web development servers"
depends = ["//web:build"]
run = { tasks = ["dev-backend", "//web:dev"] }

[tasks.dev-tls]
description = "Generate repo-local development TLS files"
run = """
mkdir -p .local/tls/ca
CAROOT="$PWD/.local/tls/ca" mkcert \
  -cert-file .local/tls/woodstar.pem \
  -key-file .local/tls/woodstar-key.pem \
  woodstar
"""

[tasks.dev-tls-trust]
description = "Trust the repo-local development CA on this machine"
depends = ["dev-tls"]
run = 'CAROOT="$PWD/.local/tls/ca" mkcert -install'

[tasks.dev-backend]
depends = ["geoip"]
run = "air"

[tasks.build]
description = "Build web bundle and backend binary"
depends = ["//web:build"]
run = { task = "backend" }

[tasks.docs]
description = "Check and build the documentation"
run = [
  { task = "//docs:fmt-check" },
  { task = "//docs:lint" },
  { task = "//docs:typecheck" },
  { task = "//docs:build" },
]

[tasks.frontend-check]
description = "Verify the web app and generated API contracts"
depends = ["generate"]
run = [
  '''
generated_status=$(git status --short --untracked-files=all -- \
  web/openapi.yaml web/src/lib/api-client test/e2e/adminapi/client.gen.go)
test -z "$generated_status" || {
  printf '%s\n' "$generated_status"
  git diff -- web/openapi.yaml web/src/lib/api-client test/e2e/adminapi/client.gen.go
  exit 1
}
''',
  { task = "//web:fmt-check" },
  "pnpm --dir web run lint",
  "pnpm --dir web run test",
  "pnpm --dir web run build",
  { task = "backend" },
]

[tasks.backend]
description = "Build the backend binary"
run = "go build -o woodstar ./cmd/woodstar"

[tasks.geoip]
description = "Download the current DB-IP Lite databases"
run = "go run ./tools/geoipdb --output .local/geoip"

[tasks.tidy]
run = "go mod tidy"

[tasks.tidy-check]
run = "go mod tidy -diff"

[tasks.vulncheck]
run = "govulncheck ./..."

[tasks.migration]
description = "Create a timestamped PostgreSQL migration"
usage = '''
arg "<name>"
'''
run = '''
goose -dir internal/postgres/migrations create "${usage_name?}" sql
'''

[tasks."migration:validate"]
description = "Validate PostgreSQL migration files"
run = "goose -dir internal/postgres/migrations validate"

[tasks.test]
description = "Fetch GeoIP data and run race-enabled tests"
depends = ["geoip"]
run = [
  "WOODSTAR_GEOIP_CITY_FILE=$PWD/.local/geoip/dbip-city-lite.mmdb WOODSTAR_GEOIP_ASN_FILE=$PWD/.local/geoip/dbip-asn-lite.mmdb go vet ./...",
  "WOODSTAR_GEOIP_CITY_FILE=$PWD/.local/geoip/dbip-city-lite.mmdb WOODSTAR_GEOIP_ASN_FILE=$PWD/.local/geoip/dbip-asn-lite.mmdb go test -race -count=1 ./...",
]

[tasks.test-postgres]
description = "Run Go tests with PostgreSQL component coverage"
depends = ["geoip"]
run = """
WOODSTAR_GEOIP_CITY_FILE="$PWD/.local/geoip/dbip-city-lite.mmdb" \
WOODSTAR_GEOIP_ASN_FILE="$PWD/.local/geoip/dbip-asn-lite.mmdb" \
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=postgres ./...
"""

[tasks.test-e2e-munki]
description = "Requires PostgreSQL"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestMunki$' ./test/e2e
"""

[tasks.test-e2e-osquery]
description = "Requires PostgreSQL"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestOsquery(d)?$' ./test/e2e
"""

[tasks.test-e2e-santa]
description = "Requires PostgreSQL"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestSanta$' ./test/e2e
"""

[tasks.test-e2e-mdp]
description = "Requires PostgreSQL"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestMDP$' ./test/e2e
"""

[tasks.test-e2e-orbit]
description = "Requires PostgreSQL"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v -run '^TestOrbit$' ./test/e2e
"""

[tasks.test-e2e]
description = "Run end-to-end tests against PostgreSQL"
run = """
WOODSTAR_TEST_DATABASE_URL="${WOODSTAR_TEST_DATABASE_URL:-postgres://woodstar:woodstar@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 -tags=e2e -v ./test/e2e
"""

[tasks.test-all]
description = "Run Go, PostgreSQL, and end-to-end tests"
run = [{ task = "test-postgres" }, { task = "test-e2e" }]

[tasks.openapi]
description = "Generate OpenAPI schema"
run = "go run ./cmd/woodstar openapi --output web/openapi.yaml"

[tasks.generate]
description = "Regenerate the OpenAPI schema and clients"
run = [
  { task = "openapi" },
  { task = "//web:openapi-types" },
  "go tool oapi-codegen -config test/e2e/adminapi/oapi-codegen.yaml -o test/e2e/adminapi/client.gen.go web/openapi.yaml",
]

[tasks.go-lint]
run = "golangci-lint run"

[tasks.go-lint-fix]
run = "golangci-lint run --fix"

[tasks.lint-fix]
description = "Fix lint issues in the backend, web app and docs"
depends = ["go-lint-fix", "//web:lint-fix", "//docs:lint-fix"]

[tasks.lint]
description = "Lint the backend, web app and docs"
depends = ["go-lint", "//web:lint", "//docs:lint"]

[tasks.go-format]
run = "go fmt ./..."

[tasks.go-fmt-check]
run = '''
unformatted=$(gofmt -l .) || exit 1
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''

[tasks.format]
description = "Format the backend, web app and docs"
depends = ["go-format", "//web:format", "//docs:format"]

[tasks.fmt-check]
description = "Check formatting in the backend, web app and docs"
depends = ["go-fmt-check", "//web:fmt-check", "//docs:fmt-check"]

[tasks.clean]
run = "rm -rf woodstar .air build web/dist"

[tasks.schema-sync]
description = "Refresh the osquery schema snapshot"
run = "./schema/sync.sh"

[tasks.container-build]
run = '''
docker build \
  --build-arg GO_VERSION="$(mise config get tools.go)" \
  --build-arg NODE_VERSION="$(mise config get tools.node)" \
  --build-arg GO_LICENSES_VERSION="$(mise tool go:github.com/google/go-licenses/v2 --requested)" \
  -t woodstar:local .
'''

[hooks]
postinstall = "lefthook install"
